name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test (E2E excluded)
        run: dotnet test --solution AoCEditor.slnx -c Release --no-build --filter-not-trait "Category=E2E" --ignore-exit-code 8
      - name: Practice checks
        if: runner.os == 'Linux'
        run: ./scripts/check-practices.sh
      - name: Format check
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore
      - name: AoT publish smoke
        run: dotnet publish src/App -c Release -r ${{ matrix.rid }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet docfx docfx.json
