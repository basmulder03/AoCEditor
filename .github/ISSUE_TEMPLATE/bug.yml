name: Bug
description: Create a BUG issue
labels: ["BUG"]
body:
  - type: markdown
    attributes:
      value: "WARNING: never paste session tokens, puzzle text or puzzle inputs."
  - type: input
    id: version
    attributes: {label: App version}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Operating system}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behaviour}
    validations: {required: true}
  - type: dropdown
    id: moscow
    attributes:
      label: MoSCoW
      options: [MUST, SHOULD, COULD, WONT]
    validations: {required: true}
